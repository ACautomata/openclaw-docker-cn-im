name: CI Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-validate:
    name: Lint & Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 检查 init.sh bash 语法
        run: bash -n init.sh

      - name: 检查 init.sh 换行符 (必须 LF)
        run: |
          if file init.sh | grep -qi CRLF; then
            echo "::error::init.sh 包含 CRLF 换行符，必须使用 LF"
            exit 1
          fi

      - name: 校验 version.txt 格式
        run: |
          v=$(tr -d '[:space:]' < version.txt)
          if [[ ! "$v" =~ ^[0-9]{4}\.[0-9]+\.[0-9]+(-[a-zA-Z0-9._-]+)?$ ]]; then
            echo "::error::version.txt 格式应为 YYYY.M.N 或 YYYY.M.N-suffix，当前值: $v"
            exit 1
          fi

      - name: 校验 docker-compose.yml 语法
        env:
          OPENCLAW_IMAGE: openclaw-test:ci
          OPENCLAW_DATA_DIR: /tmp/openclaw-data
          OPENCLAW_GATEWAY_PORT: 18789
          DISCORD_BOT_TOKEN: ""
          DISCORD_DM_POLICY: ""
          DISCORD_ALLOW_FROM: ""
          DISCORD_GROUP_POLICY: ""
        run: docker compose config --quiet 2>&1

  python-config-tests:
    name: Python Config Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装 pytest
        run: pip install pytest

      - name: 提取 init.sh 中的 Python 配置生成代码
        run: python3 tests/extract_python.py

      - name: 运行配置生成测试
        run: pytest tests/test_config_gen.py -v --tb=short

  dockerfile-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建 Docker 镜像 (amd64)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: openclaw-test:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            CLAWHUB_TOKEN=${{ secrets.CLAWHUB_TOKEN }}

      - name: 保存镜像供后续测试
        run: docker save openclaw-test:ci | gzip > /tmp/openclaw-image.tar.gz

      - name: 上传镜像 artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/openclaw-image.tar.gz
          retention-days: 1

  container-startup:
    name: Container Startup Test
    runs-on: ubuntu-latest
    needs: dockerfile-build
    steps:
      - uses: actions/checkout@v4

      - name: 下载镜像 artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: 加载 Docker 镜像
        run: docker load < /tmp/openclaw-image.tar.gz

      - name: 创建测试数据目录
        run: mkdir -p /tmp/openclaw-data

      - name: 启动容器
        run: |
          docker run -d \
            --name openclaw-ci \
            -p 18789:18789 \
            -v /tmp/openclaw-data:/home/node/.openclaw \
            -e MODEL_ID=gpt-4o \
            -e BASE_URL=https://api.example.com/v1 \
            -e API_KEY=test-key \
            -e API_PROTOCOL=openai-completions \
            -e OPENCLAW_GATEWAY_TOKEN=test-ci-token \
            -e OPENCLAW_GATEWAY_PORT=18789 \
            -e OPENCLAW_GATEWAY_BIND=lan \
            -e SYNC_OPENCLAW_CONFIG=true \
            -e AGENT_REACH_ENABLED=false \
            openclaw-test:ci

      - name: 等待 Gateway 启动
        run: |
          echo "等待 Gateway 启动..."
          for i in $(seq 1 60); do
            if docker logs openclaw-ci 2>&1 | grep -q "Gateway"; then
              echo "Gateway 启动成功"
              break
            fi
            if [ $i -eq 60 ]; then
              echo "超时: Gateway 未在 120 秒内启动"
              docker logs openclaw-ci 2>&1 || true
              exit 1
            fi
            sleep 2
          done

      - name: 验证端口 18789 响应
        run: |
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:18789/ 2>/dev/null; then
              echo "端口 18789 已响应"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "超时: 端口 18789 未响应"
              docker logs openclaw-ci 2>&1 || true
              exit 1
            fi
            sleep 2
          done

      - name: 验证插件安装
        run: |
          echo "=== 检查 seed 目录 ==="
          docker exec openclaw-ci ls -la /home/node/.openclaw-seed/ 2>/dev/null || echo "seed 目录不存在"
          docker exec openclaw-ci ls -la /home/node/.openclaw-seed/extensions/ 2>/dev/null || echo "seed/extensions 不存在"
          docker exec openclaw-ci ls -la /home/node/.openclaw-seed/npm/ 2>/dev/null || echo "seed/npm 不存在"

          echo ""
          echo "=== 检查 init 日志中的 seed 同步输出 ==="
          docker logs openclaw-ci 2>&1 | grep -E '(同步内置|seed|npm|插件)' || echo "无 seed 同步相关日志"

          echo ""
          echo "=== 检查插件目录结构 ==="
          echo "--- extensions/ ---"
          docker exec openclaw-ci ls -la /home/node/.openclaw/extensions/ 2>/dev/null || echo "extensions/ 不存在"
          echo "--- npm/ ---"
          docker exec openclaw-ci ls -la /home/node/.openclaw/npm/ 2>/dev/null || echo "npm/ 不存在"
          docker exec openclaw-ci ls /home/node/.openclaw/npm/node_modules/ 2>/dev/null | head -20 || echo "npm/node_modules/ 不存在"

          echo ""
          echo "=== 检查各插件是否存在 ==="
          # OpenClaw 2026.5+ 的插件可能安装在 npm/node_modules 或 npm/projects 目录下
          FAIL=0
          docker exec -i openclaw-ci python3 <<'PY'
          import glob
          import os
          import sys

          base = '/home/node/.openclaw'
          required = {
              'discord': [f'{base}/npm/node_modules/@openclaw/discord', f'{base}/npm/projects/*/node_modules/@openclaw/discord'],
              'feishu': [f'{base}/npm/node_modules/@openclaw/feishu', f'{base}/npm/projects/*/node_modules/@openclaw/feishu'],
              'lossless-claw': [f'{base}/npm/node_modules/@martian-engineering/lossless-claw', f'{base}/npm/projects/*/node_modules/@martian-engineering/lossless-claw'],
              'dingtalk': [f'{base}/npm/node_modules/@soimy/dingtalk', f'{base}/npm/projects/*/node_modules/@soimy/dingtalk'],
              'qqbot': [f'{base}/npm/node_modules/@tencent-connect/openclaw-qqbot', f'{base}/npm/projects/*/node_modules/@tencent-connect/openclaw-qqbot'],
              'wecom': [f'{base}/npm/node_modules/@sunnoy/wecom', f'{base}/npm/projects/*/node_modules/@sunnoy/wecom'],
              'napcat': [f'{base}/extensions/napcat'],
          }

          missing = []
          for name, patterns in required.items():
              found = []
              for pattern in patterns:
                  found.extend(path for path in glob.glob(pattern) if os.path.isdir(path))
              if found:
                  print(f'✅ {name} → {found[0]}')
              else:
                  missing.append(name)

          if missing:
              print('❌ 未找到插件: ' + ', '.join(missing))
              sys.exit(1)
          PY

          echo ""
          echo "=== 检查 openclaw.json 插件 installPath ==="
          docker exec openclaw-ci python3 -c "
          import json, os, sys
          cfg = json.load(open('/home/node/.openclaw/openclaw.json'))
          installs = cfg.get('plugins', {}).get('installs', {})
          errors = []
          for pid, info in installs.items():
              ip = info.get('installPath', '')
              if ip and not os.path.isdir(ip):
                  errors.append(f'{pid}: installPath={ip} (目录不存在)')
          if errors:
              for e in errors:
                  print(f'❌ {e}')
              sys.exit(1)
          else:
              print('✅ 所有已启用插件的 installPath 均指向有效目录')
          "

          echo ""
          echo "=== 检查容器日志中无插件禁用警告 ==="
          if docker logs openclaw-ci 2>&1 | grep -q '插件.*不存在.*已禁用'; then
            echo "❌ 发现插件禁用警告:"
            docker logs openclaw-ci 2>&1 | grep '插件.*不存在.*已禁用'
            FAIL=1
          else
            echo "✅ 无插件禁用警告"
          fi

          if [ "$FAIL" -ne 0 ]; then
            echo ""
            echo "❌ 插件验证失败"
            exit 1
          fi
          echo ""
          echo "✅ 插件验证全部通过"

      - name: 验证 openclaw CLI
        run: |
          echo "=== openclaw 版本 ==="
          docker exec openclaw-ci openclaw --version || {
            echo "❌ openclaw CLI 无法运行"
            exit 1
          }
          echo "✅ openclaw CLI 正常"

      - name: 验证全局 npm 包
        run: |
          echo "=== 检查全局 npm 包 ==="
          FAIL=0
          PKGS="openclaw @tobilu/qmd @larksuiteoapi/node-sdk playwright clawhub"
          for pkg in $PKGS; do
            if docker exec openclaw-ci test -d "/usr/local/lib/node_modules/$pkg"; then
              echo "✅ $pkg"
            else
              echo "❌ $pkg 未安装"
              FAIL=1
            fi
          done
          if [ "$FAIL" -ne 0 ]; then
            echo "❌ 缺少全局 npm 包"
            exit 1
          fi
          echo "✅ 所有全局 npm 包已安装"

      - name: 验证 openclaw plugins list
        run: |
          echo "=== openclaw plugins list ==="
          PLUGINS_OUT=$(docker exec openclaw-ci openclaw plugins list 2>&1) || {
            echo "❌ openclaw plugins list 执行失败"
            echo "$PLUGINS_OUT"
            exit 1
          }
          echo "$PLUGINS_OUT"
          echo ""
          FAIL=0
          EXPECTED="discord feishu dingtalk qqbot wecom napcat lossless-claw"
          for pid in $EXPECTED; do
            if echo "$PLUGINS_OUT" | grep -qi "$pid"; then
              echo "✅ 插件 $pid 已识别"
            else
              echo "❌ 插件 $pid 未在列表中"
              FAIL=1
            fi
          done
          if [ "$FAIL" -ne 0 ]; then
            exit 1
          fi
          echo "✅ openclaw plugins list 通过"

      - name: 验证 seed-version 一致性
        run: |
          echo "=== seed-version 检查 ==="
          SEED_VERSION=$(docker exec openclaw-ci cat /home/node/.openclaw/extensions/.seed-version 2>/dev/null | tr -d '[:space:]')
          IMAGE_VERSION=$(tr -d '[:space:]' < version.txt)
          echo "seed-version: $SEED_VERSION"
          echo "version.txt:  $IMAGE_VERSION"
          if [ "$SEED_VERSION" = "$IMAGE_VERSION" ]; then
            echo "✅ seed-version 与 version.txt 一致"
          else
            echo "❌ seed-version ($SEED_VERSION) 与 version.txt ($IMAGE_VERSION) 不一致"
            exit 1
          fi

      - name: 验证 openclaw.json 结构
        run: |
          echo "=== openclaw.json 结构检查 ==="
          docker exec openclaw-ci python3 -c "
          import json, sys

          with open('/home/node/.openclaw/openclaw.json') as f:
              cfg = json.load(f)

          required_keys = ['models', 'gateway', 'plugins', 'channels', 'agents', 'tools', 'messages', 'browser']
          missing = [k for k in required_keys if k not in cfg]
          if missing:
              print(f'❌ 缺少顶层 key: {missing}')
              sys.exit(1)

          print('✅ 所有顶层 key 存在')

          # 验证 plugins.installs
          installs = cfg.get('plugins', {}).get('installs', {})
          expected_plugins = ['discord', 'feishu', 'dingtalk', 'openclaw-qqbot', 'napcat', 'wecom', 'lossless-claw']

          for pid in expected_plugins:
              if pid in installs:
                  ip = installs[pid].get('installPath', '')
                  if ip:
                      print(f'  ✅ {pid}: {ip}')
                  else:
                      print(f'  ❌ {pid}: installPath 为空')
                      sys.exit(1)
              else:
                  print(f'  ❌ {pid}: 不在 plugins.installs 中')
                  sys.exit(1)

          print('✅ openclaw.json 结构完整')
          "

      - name: 验证容器日志无错误
        run: |
          echo "=== 日志错误扫描 ==="
          LOGS=$(docker logs openclaw-ci 2>&1)
          FAIL=0

          # 检查致命错误模式
          for pattern in 'FATAL' 'panic' 'segmentation fault' 'SIGSEGV'; do
            if echo "$LOGS" | grep -qi "$pattern"; then
              echo "❌ 发现错误模式: $pattern"
              echo "$LOGS" | grep -i "$pattern" || true
              FAIL=1
            fi
          done

          # 检查启动错误 (排除正常的 info 日志)
          ERRORS=$(echo "$LOGS" | grep -i '\[error\]' || true)
          if [ -n "$ERRORS" ]; then
            echo "⚠️ 发现 error 级别日志 (需人工判断):"
            echo "$ERRORS"
          else
            echo "✅ 无 error 级别日志"
          fi

          if [ "$FAIL" -ne 0 ]; then
            exit 1
          fi
          echo "✅ 日志无致命错误"

      - name: 输出容器日志 (失败时)
        if: failure()
        run: |
          echo "=== 容器日志 ==="
          docker logs openclaw-ci 2>&1 || true
          echo "=== 容器状态 ==="
          docker inspect openclaw-ci --format='{{.State.Status}} {{.State.ExitCode}}' 2>/dev/null || true

      - name: 清理容器
        if: always()
        run: docker rm -f openclaw-ci 2>/dev/null || true
