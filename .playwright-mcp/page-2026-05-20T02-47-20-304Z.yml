                    - /url: https://losslesscontext.ai
                  - text: .
                - paragraph [ref=e662]: "When a conversation grows beyond the model's context window, OpenClaw (just like all of the other agents) normally truncates older messages. LCM instead:"
                - list [ref=e663]:
                  - listitem [ref=e664]:
                    - strong [ref=e665]: Persists every message
                    - text: in a SQLite database, organized by conversation
                  - listitem [ref=e666]:
                    - strong [ref=e667]: Summarizes chunks
                    - text: of older messages into summaries using your configured LLM
                  - listitem [ref=e668]:
                    - strong [ref=e669]: Condenses summaries
                    - text: into higher-level nodes as they accumulate, forming a DAG (directed acyclic graph)
                  - listitem [ref=e670]:
                    - strong [ref=e671]: Assembles context
                    - text: each turn by combining summaries + recent raw messages
                  - listitem [ref=e672]:
                    - strong [ref=e673]: Provides tools
                    - text: (
