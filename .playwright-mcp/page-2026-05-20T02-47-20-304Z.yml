                - paragraph [ref=e677]: Nothing is lost. Raw messages stay in the database. Summaries link back to their source messages. Agents can drill into any summary to recover the original detail.
                - paragraph [ref=e678]:
                  - strong [ref=e679]: It feels like talking to an agent that never forgets. Because it doesn't. In normal operation, you'll never need to think about compaction again.
